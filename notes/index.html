<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Notes — Quran Connect</title>
  <meta name="description" content="Every note you have written, ayah by ayah, ready to print or save as a PDF.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='28'%3E%F0%9F%93%9D%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Amiri+Quran&display=swap" rel="stylesheet">
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (t !== "light") document.documentElement.dataset.theme = "dark";
      } catch (e) {}
    })();
  </script>
  <style>
    :root{
      --bg:#fbf7ef; --surface:#fffdf8; --border:#e2d8c6;
      --text:#241c14; --text-sec:#6b5c48; --text-ter:#93826c;
      --accent:#a9762c;
      --font:'Inter',system-ui,sans-serif;
      --font-display:'Fraunces',Georgia,serif;
      --font-ar:'Amiri Quran',serif;
    }
    :root[data-theme="dark"]{
      --bg:#120b21; --surface:#1b1030; --border:rgba(255,255,255,.13);
      --text:#efe7ff; --text-sec:#b9a7d6; --text-ter:#8d7ba8;
      --accent:#f5b75e;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);
      -webkit-text-size-adjust:100%}

    /* ── Screen chrome (never printed) ─────────────────────────────────── */
    .bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;
      flex-wrap:wrap;padding:12px 20px;background:var(--bg);
      border-bottom:1px solid var(--border)}
    .bar a.back{color:var(--text-ter);text-decoration:none;font-size:.85rem;font-weight:600}
    .bar a.back:hover{color:var(--accent)}
    .bar .grow{flex:1}
    .bar h1{font-family:var(--font-display);font-size:1.1rem;font-weight:600;margin:0}
    .print-btn{font:inherit;font-size:.85rem;font-weight:700;padding:9px 18px;
      border:none;border-radius:999px;cursor:pointer;background:var(--accent);
      color:#1a1004}
    .print-btn:hover{filter:brightness(1.07)}
    .print-btn:disabled{opacity:.5;cursor:default}

    .sheet{max-width:820px;margin:0 auto;padding:28px 20px 80px}
    .state{padding:60px 20px;text-align:center;color:var(--text-sec);font-size:.95rem}
    .state b{display:block;font-size:1.1rem;color:var(--text);margin-bottom:8px;
      font-family:var(--font-display)}

    .doc-head{margin-bottom:26px;padding-bottom:16px;border-bottom:2px solid var(--accent)}
    .doc-title{font-family:var(--font-display);font-size:1.8rem;font-weight:700;margin:0 0 4px}
    .doc-meta{font-size:.85rem;color:var(--text-sec)}

    .surah-head{font-family:var(--font-display);font-size:1.15rem;font-weight:600;
      margin:30px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--border);
      display:flex;align-items:baseline;gap:10px}
    .surah-head .sh-ar{font-family:var(--font-ar);font-size:1.25rem;margin-inline-start:auto;
      direction:rtl}

    .entry{margin:0 0 18px;padding:16px 18px;border-radius:10px;
      background:var(--surface);border:1px solid var(--border);
      break-inside:avoid;page-break-inside:avoid}
    .entry-ref{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.03em;
      color:var(--accent);border:1px solid var(--accent);border-radius:999px;
      padding:2px 10px;margin-bottom:10px}
    .entry-ar{font-family:var(--font-ar);font-size:1.5rem;line-height:2.15;
      direction:rtl;text-align:right;margin-bottom:10px}
    .entry-tr{font-size:.92rem;line-height:1.65;color:var(--text-sec);
      padding-inline-start:12px;border-inline-start:2px solid var(--border);
      margin-bottom:14px}
    .entry-tr .src{display:block;font-size:.7rem;font-weight:700;letter-spacing:.04em;
      text-transform:uppercase;color:var(--text-ter);margin-bottom:3px}
    .note{padding:10px 0;border-top:1px dashed var(--border)}
    .note:first-of-type{border-top:1px solid var(--border);margin-top:2px}
    .note-date{font-size:.7rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
      color:var(--text-ter);margin-bottom:5px}
    .note-body{white-space:pre-wrap;line-height:1.7;font-size:.95rem;overflow-wrap:anywhere}

    /* ── Print ─────────────────────────────────────────────────────────── */
    @page{margin:16mm 14mm}
    @media print{
      /* Print on white regardless of the theme the reader was using. */
      :root,:root[data-theme="dark"]{
        --bg:#fff; --surface:#fff; --border:#c9c2b6;
        --text:#000; --text-sec:#333; --text-ter:#666; --accent:#7a5518;
      }
      body{background:#fff}
      .bar,.no-print{display:none !important}
      .sheet{max-width:none;margin:0;padding:0}
      .entry{border:none;padding:0 0 6px;background:none;margin-bottom:14px;
        border-bottom:1px solid #ddd}
      .surah-head{break-after:avoid;page-break-after:avoid}
      .doc-head{border-bottom-width:1.5pt}
      a{color:inherit;text-decoration:none}
    }
  </style>
</head>
<body>

  <div class="bar no-print">
    <a class="back" href="../">← Quran Connect</a>
    <h1>My Notes</h1>
    <div class="grow"></div>
    <span id="notes-account"></span>
    <button class="print-btn" id="print-btn" type="button" disabled>Print / Save as PDF</button>
  </div>

  <div class="sheet">
    <div class="state" id="state"><b>Gathering your notes…</b>One moment.</div>
    <div id="doc" hidden></div>
  </div>

  <script src="../assets/notes.js?v=2"></script>
  <script src="../assets/notes-ui.js?v=2"></script>
  <script src="print.js?v=2"></script>
</body>
</html>
